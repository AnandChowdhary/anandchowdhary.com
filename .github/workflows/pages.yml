name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [content-published]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: UTC

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
        id: pages
        if: github.event_name != 'pull_request'
      - uses: actions/cache@v6
        with:
          path: .cache/static-images
          key: static-images-${{ runner.os }}-${{ github.run_id }}
          restore-keys: static-images-${{ runner.os }}-
      - name: Restore optional source snapshots
        uses: actions/cache@v6
        if: github.event_name != 'pull_request'
        with:
          path: .cache/optional-sources
          key: optional-sources-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: optional-sources-v1-${{ runner.os }}-
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Collect and validate content inputs
        id: content
        run: npm run content:snapshot
      - run: npm run build:render
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
      - run: npm run verify:build
      - name: Verify built routes and browser-independent smoke checks
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
        run: |
          node scripts/serve-static.mjs > /tmp/static-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4322/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs "http://localhost:4322${PAGES_BASE_PATH%/}"
          node scripts/link-audit.mjs "http://localhost:4322${PAGES_BASE_PATH%/}"
      - name: Retain reproducible content inputs
        uses: actions/upload-artifact@v7
        with:
          name: content-inputs-${{ github.run_id }}
          path: ${{ steps.content.outputs.snapshot }}
          retention-days: 3
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Verify the published artifact
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/smoke.mjs "${SITE_URL/http:/https:}" --check-freshness

  report:
    if: always() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Track production deployment failures
        uses: actions/github-script@v9
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const marker = '<!-- pages-production-incident -->';
            const repo = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...repo, state: 'open', per_page: 100 });
            const incident = issues.find(issue => !issue.pull_request && issue.body?.includes(marker) && issue.user?.login === 'github-actions[bot]');
            const failed = process.env.BUILD_RESULT !== 'success' || process.env.DEPLOY_RESULT !== 'success';
            const run = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            if (failed && !incident) {
              await github.rest.issues.create({ ...repo, title: 'Production Pages deployment is failing', body: `${marker}\n\n[Failed workflow](${run}). A failed build leaves the published artifact intact. Inspect the public site and workflow logs before retrying. This issue closes automatically after a successful deployment.` });
            } else if (!failed && incident) {
              await github.rest.issues.update({ ...repo, issue_number: incident.number, state: 'closed', state_reason: 'completed' });
            }
            await core.summary.addHeading(failed ? 'Deployment failed' : 'Deployment succeeded').addLink('Workflow run', run).write();

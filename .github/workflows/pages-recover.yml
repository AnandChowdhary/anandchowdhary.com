name: Recover GitHub Pages artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful production Pages run ID with a retained artifact
        required: true
        type: string
      operation:
        description: Rehearse verification or publish the selected artifact
        required: true
        type: choice
        default: rehearse
        options: [rehearse, deploy]

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/configure-pages@v6
        id: pages
      - name: Validate source production run
        id: source
        run: node scripts/select-recovery.mjs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          path: recovery-download
      - name: Extract and verify retained content without rebuilding
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_BASE: ${{ steps.pages.outputs.base_path || '/' }}
        run: |
          python3 scripts/extract-recovery.py recovery-download/artifact.tar recovery-site
          node scripts/verify-recovery.mjs recovery-site
      - name: Rehearse the recovered site locally
        env:
          STATIC_DIR: recovery-site
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          SMOKE_EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          node scripts/serve-static.mjs > /tmp/recovery-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4322/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs "http://localhost:4322${PAGES_BASE_PATH%/}" --check-freshness
      - name: Publish recovery receipt
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          echo "## Pages recovery: $OPERATION" >> "$GITHUB_STEP_SUMMARY"
          echo "Source production run: $SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          cat recovery-site/recovery.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: recovery-receipt-${{ github.run_id }}
          path: recovery-site/recovery.json
          retention-days: 30
      - uses: actions/upload-pages-artifact@v5
        with:
          path: recovery-site
          retention-days: 7

  deploy:
    if: inputs.operation == 'deploy' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Verify the recovered public site and identity
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          SMOKE_EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/smoke.mjs "${SITE_URL/http:/https:}" --check-freshness
